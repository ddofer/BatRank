[project]
name = "batchat-dataset"
version = "0.1.0"
description = "A reproducible snapshot of BatChat's Batman story rankings"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32,<3",
  "beautifulsoup4>=4.13,<5",
  "mwparserfromhell>=0.7,<1",
  "pandas>=2.2,<3",
  "scikit-learn>=1.7,<2",
  "matplotlib>=3.10,<4",
  "nbformat>=5.10,<6",
  "nbclient>=0.10,<1",
  "ipykernel>=6,<8",
  "wordcloud>=1.9,<2",
  "seaborn>=0.13,<0.14",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402"]  # one import block per notebook cell
